name: Weather Dashboard CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js with npm caching
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies using npm ci
        run: npm ci

      - name: Run ESLint using npm run lint
        run: npm run lint

      - name: Run component tests using npm test
        run: npm test

      - name: Build the production application using npm run build
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-dashboard-build
          path: dist/
          if-no-files-found: error
